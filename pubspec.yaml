name: avataria
description: "AvatarGenius: transforme uma selfie numa caricatura com IA e converse com ela."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  gal: ^3.0.1
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: BagelFatOne
      fonts:
        - asset: assets/fonts/BagelFatOne-Regular.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
